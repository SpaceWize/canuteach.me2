<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" role="img" aria-label="Friendly blocky mascot waving hello">
  <defs>
    <linearGradient id="ms-body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#1D4ED8"/></linearGradient>
  </defs>

  <!-- stud on top, the blocky-toy cue -->
  <rect x="82" y="8" width="36" height="16" rx="6" fill="#F5C542"/>
  <!-- head -->
  <rect x="58" y="22" width="84" height="72" rx="14" fill="#F5C542"/>
  <circle cx="82" cy="54" r="6.5" fill="#0F172A"/>
  <circle cx="118" cy="54" r="6.5" fill="#0F172A"/>
  <path d="M80 72q20 16 40 0" stroke="#0F172A" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- neck -->
  <rect x="88" y="94" width="24" height="12" rx="4" fill="#E0A82E"/>

  <!-- torso -->
  <rect x="52" y="106" width="96" height="88" rx="14" fill="url(#ms-body)"/>
  <!-- little screen badge on the chest -->
  <rect x="76" y="128" width="48" height="34" rx="6" fill="#FFFFFF" opacity=".95"/>
  <rect x="83" y="136" width="24" height="4" rx="2" fill="#0EA5E9"/>
  <rect x="83" y="145" width="34" height="4" rx="2" fill="#BFDBFE"/>
  <rect x="83" y="153" width="18" height="4" rx="2" fill="#BFDBFE"/>

  <!-- waving arm (left) -->
  <g transform="rotate(-24 52 130)">
    <rect x="26" y="118" width="30" height="66" rx="13" fill="#1D4ED8"/>
    <circle cx="41" cy="188" r="15" fill="#F5C542"/>
  </g>
  <!-- resting arm (right) -->
  <rect x="144" y="118" width="30" height="66" rx="13" fill="#1D4ED8"/>
  <circle cx="159" cy="188" r="15" fill="#F5C542"/>

  <!-- legs -->
  <rect x="64" y="194" width="32" height="52" rx="10" fill="#0F172A"/>
  <rect x="104" y="194" width="32" height="52" rx="10" fill="#0F172A"/>
  <rect x="58" y="238" width="44" height="16" rx="7" fill="#334155"/>
  <rect x="98" y="238" width="44" height="16" rx="7" fill="#334155"/>
</svg>
